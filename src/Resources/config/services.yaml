services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    # Admin
    Manuxi\SuluAbbreviationsBundle\Admin\AbbreviationsAdmin:
        arguments:
            - '@sulu_admin.view_builder_factory'
            - '@sulu_content.content_view_builder_factory'
            - '@sulu_security.security_checker'
            - '@sulu_core.webspace.webspace_manager'
            - '@sulu_activity.activity_list_view_builder_factory'
            - '@sulu_reference.reference_list_view_builder_factory'
            - '@?sulu_automation.automation_view_builder_factory'
            - '@=parameter("sulu_abbreviations.versioning.max_versions") > 0'
        tags:
            - { name: sulu.admin }
            - { name: sulu.context, context: admin }

    Manuxi\SuluAbbreviationsBundle\Admin\SettingsAdmin:
        arguments:
            - '@sulu_admin.view_builder_factory'
            - '@sulu_security.security_checker'
        tags:
            - { name: sulu.admin }
            - { name: sulu.context, context: admin }

    # Controller
    Manuxi\SuluAbbreviationsBundle\Controller\Admin\AbbreviationController:
        public: true
        arguments:
            - '@fos_rest.view_handler.default'
            - '@security.token_storage'
            - '@sulu_core.list_builder.field_descriptor_factory'
            - '@sulu_core.doctrine_list_builder_factory'
            - '@sulu_core.doctrine_rest_helper'
            - '@sulu_content.content_manager'
            - '@sulu_content.content_indexer'
            - '@doctrine.orm.entity_manager'
            - '@sulu_activity.domain_event_collector'
            - '@sulu_trash.trash_manager'
            - '@sulu_security.security_checker'
            - '@Manuxi\SuluAbbreviationsBundle\Route\AbbreviationRouteRemover'
            - '@Manuxi\SuluAbbreviationsBundle\Translation\AbbreviationTranslationRemover'
            - '@Manuxi\SuluAbbreviationsBundle\Reference\AbbreviationReferenceUpdater'
        tags:
            - { name: controller.service_arguments }
            - { name: sulu.context, context: admin }

    Manuxi\SuluAbbreviationsBundle\Controller\Admin\SettingsController:
        public: true
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@fos_rest.view_handler.default'
            - '@sulu_activity.domain_event_collector'
            - '@security.token_storage'
        tags:
            - { name: controller.service_arguments }
            - { name: sulu.context, context: admin }

    Manuxi\SuluAbbreviationsBundle\Controller\Admin\AbbreviationVersionController:
        public: true
        arguments:
            - '@fos_rest.view_handler.default'
            - '@security.token_storage'
            - '@sulu_core.list_rest_helper'
            - '@Manuxi\SuluAbbreviationsBundle\Repository\AbbreviationVersionRepository'
            - '@sulu_content.content_manager'
            - '@sulu_content.content_indexer'
            - '@doctrine.orm.entity_manager'
            - '@sulu_activity.domain_event_collector'
            - '@sulu_security.security_checker'
            - '@Manuxi\SuluAbbreviationsBundle\Reference\AbbreviationReferenceUpdater'
        tags:
            - { name: controller.service_arguments }
            - { name: sulu.context, context: admin }

    # Repository and resolver
    Manuxi\SuluAbbreviationsBundle\Repository\AbbreviationRepository:
        arguments:
            - '@doctrine.orm.entity_manager'

    Manuxi\SuluAbbreviationsBundle\Repository\AbbreviationVersionRepository:
        arguments:
            - '@doctrine.orm.entity_manager'

    Manuxi\SuluAbbreviationsBundle\Versioning\VersionRecorder:
        arguments:
            - '@Manuxi\SuluAbbreviationsBundle\Repository\AbbreviationVersionRepository'
            - '@sulu_content.content_manager'
            - '@security.token_storage'
            - '%sulu_abbreviations.versioning.max_versions%'
        tags:
            - { name: kernel.event_listener, event: workflow.content_workflow.completed.publish, method: onPublish }

    Manuxi\SuluAbbreviationsBundle\Route\AbbreviationRouteRemover:
        arguments:
            - '@sulu.repository.route'
            - '@doctrine.orm.entity_manager'

    Manuxi\SuluAbbreviationsBundle\Translation\AbbreviationTranslationRemover:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_content.content_indexer'
            - '@Manuxi\SuluAbbreviationsBundle\Route\AbbreviationRouteRemover'
            - '@sulu_activity.domain_event_collector'
            - '@Manuxi\SuluAbbreviationsBundle\Reference\AbbreviationReferenceUpdater'

    Manuxi\SuluAbbreviationsBundle\Resolver\AbbreviationResolver:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_content.content_manager'
            - '@sulu_abbreviations.reference_store'

    sulu_abbreviations.reference_store:
        class: Sulu\Bundle\WebsiteBundle\ReferenceStore\ReferenceStore
        tags:
            - { name: sulu_website.reference_store, alias: abbreviations }

    # References
    Manuxi\SuluAbbreviationsBundle\Reference\AbbreviationReferenceUpdater:
        arguments:
            - '@sulu_reference.reference_repository'
            - '@sulu_content.content_structure_bridge_factory'
            - '@sulu.content.type_manager'

    Manuxi\SuluAbbreviationsBundle\Reference\AbbreviationReferenceSubscriber:
        arguments:
            - '@Manuxi\SuluAbbreviationsBundle\Reference\AbbreviationReferenceUpdater'
        tags:
            - { name: kernel.event_listener, event: workflow.content_workflow.completed.publish, method: onPublish }
            - { name: kernel.event_listener, event: workflow.content_workflow.completed.unpublish, method: onUnpublish }
            - { name: kernel.event_listener, event: workflow.content_workflow.completed.remove_draft, method: onRemoveDraft }

    Manuxi\SuluAbbreviationsBundle\Reference\AbbreviationReferenceRefresher:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_content.content_manager'
            - '@Manuxi\SuluAbbreviationsBundle\Reference\AbbreviationReferenceUpdater'
            - '%sulu.context%'
        tags:
            - { name: sulu_reference.refresher }

    # HTTP cache
    Manuxi\SuluAbbreviationsBundle\EventSubscriber\AbbreviationCacheInvalidationSubscriber:
        arguments:
            - '@?sulu_http_cache.cache_manager'
        tags:
            - { name: kernel.event_listener, event: workflow.content_workflow.completed.publish, method: onPublish }
            - { name: kernel.event_listener, event: workflow.content_workflow.completed.unpublish, method: onUnpublish }
            - { name: doctrine.event_listener, event: postFlush }
            - { name: kernel.event_listener, event: Manuxi\SuluAbbreviationsBundle\Domain\Event\AbbreviationRemovedEvent, method: onDomainEvent }
            - { name: kernel.event_listener, event: Manuxi\SuluAbbreviationsBundle\Domain\Event\AbbreviationTranslationRemovedEvent, method: onDomainEvent }
            - { name: kernel.event_listener, event: Manuxi\SuluAbbreviationsBundle\Domain\Event\AbbreviationRestoredEvent, method: onDomainEvent }

    # Content types
    Manuxi\SuluAbbreviationsBundle\Content\Type\AbbreviationsSelection:
        arguments:
            - '@Manuxi\SuluAbbreviationsBundle\Resolver\AbbreviationResolver'
        tags:
            - { name: sulu.content.type, alias: abbreviation_selection }

    Manuxi\SuluAbbreviationsBundle\Content\Type\SingleAbbreviationSelection:
        arguments:
            - '@Manuxi\SuluAbbreviationsBundle\Resolver\AbbreviationResolver'
        tags:
            - { name: sulu.content.type, alias: single_abbreviation_selection }

    # Link, teaser, sitemap
    Manuxi\SuluAbbreviationsBundle\Link\AbbreviationLinkProvider:
        arguments:
            - '@sulu_content.content_manager'
            - '@sulu_page.structure.factory'
            - '@doctrine.orm.entity_manager'
            - '@translator'
        tags:
            - { name: sulu.link.provider, alias: abbreviations }

    Manuxi\SuluAbbreviationsBundle\Teaser\AbbreviationTeaserProvider:
        arguments:
            - '@sulu_content.content_manager'
            - '@doctrine.orm.entity_manager'
            - '@sulu_content.content_metadata_inspector'
            - '@sulu_page.structure.factory'
            - '@translator'
            - '%sulu_document_manager.show_drafts%'
        tags:
            - { name: sulu.teaser.provider, alias: abbreviations }

    sulu_abbreviations.sitemap_provider:
        class: Sulu\Bundle\ContentBundle\Content\Infrastructure\Sulu\Sitemap\ContentSitemapProvider
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_core.webspace.webspace_manager'
            - '%kernel.environment%'
            - Manuxi\SuluAbbreviationsBundle\Entity\Abbreviation
            - '%sulu.model.route.class%'
            - 'abbreviations'
        tags:
            - { name: sulu.sitemap.provider }

    # Smart content
    sulu_abbreviations.data_provider_repository:
        class: Sulu\Bundle\ContentBundle\Content\Infrastructure\Sulu\SmartContent\Repository\ContentDataProviderRepository
        arguments:
            - '@sulu_content.content_manager'
            - '@doctrine.orm.entity_manager'
            - '%sulu_document_manager.show_drafts%'
            - Manuxi\SuluAbbreviationsBundle\Entity\Abbreviation

    sulu_abbreviations.data_provider:
        class: Manuxi\SuluAbbreviationsBundle\Content\AbbreviationsDataProvider
        arguments:
            - '@sulu_abbreviations.data_provider_repository'
            - '@sulu_core.array_serializer'
            - '@sulu_content.content_manager'
            - '@sulu_abbreviations.reference_store'
        tags:
            - { name: sulu.smart_content.data_provider, alias: abbreviations }

    # Search
    sulu_abbreviations.reindex_provider:
        class: Sulu\Bundle\ContentBundle\Content\Infrastructure\Sulu\Search\ContentReindexProvider
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_content.content_metadata_inspector'
            - '@sulu_content.content_resolver'
            - '%sulu.context%'
            - Manuxi\SuluAbbreviationsBundle\Entity\Abbreviation
        tags:
            - { name: massive_search.reindex.provider, id: abbreviations }

    sulu_abbreviations.search_metadata_provider:
        class: Sulu\Bundle\ContentBundle\Content\Infrastructure\Sulu\Search\ContentSearchMetadataProvider
        arguments:
            - '@sulu_content.content_metadata_inspector'
            - '@massive_search.factory_default'
            - '@sulu_page.structure.factory'
            - Manuxi\SuluAbbreviationsBundle\Entity\Abbreviation
        tags:
            - { name: massive_search.metadata.provider }

    # Preview
    sulu_abbreviations.preview_object_provider:
        class: Sulu\Bundle\ContentBundle\Content\Infrastructure\Sulu\Preview\ContentObjectProvider
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_content.content_resolver'
            - '@sulu_content.content_data_mapper'
            - Manuxi\SuluAbbreviationsBundle\Entity\Abbreviation
        tags:
            - { name: sulu.context, context: admin }
            - { name: sulu_preview.object_provider, provider-key: abbreviations }

    # Trash
    Manuxi\SuluAbbreviationsBundle\Trash\AbbreviationTrashItemHandler:
        arguments:
            - '@sulu_trash.trash_item_repository'
            - '@doctrine.orm.entity_manager'
            - '@sulu_trash.doctrine_restore_helper'
            - '@sulu_activity.domain_event_collector'
            - '@sulu_content.content_indexer'
        tags:
            - { name: sulu_trash.store_trash_item_handler }
            - { name: sulu_trash.restore_trash_item_handler }
            - { name: sulu_trash.restore_configuration_provider }

    # Twig
    Manuxi\SuluAbbreviationsBundle\Twig\AbbreviationsTwigExtension:
        arguments:
            - '@Manuxi\SuluAbbreviationsBundle\Repository\AbbreviationRepository'
            - '@Manuxi\SuluAbbreviationsBundle\Resolver\AbbreviationResolver'
            - '@request_stack'
            - '%sulu_abbreviations.twig.auto_abbr%'
            - '@sulu_abbreviations.reference_store'
        tags:
            - { name: twig.extension }

    Manuxi\SuluAbbreviationsBundle\Twig\AbbreviationsSettingsTwigExtension:
        arguments:
            - '@doctrine.orm.entity_manager'
        tags:
            - { name: twig.extension }
